server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ \.md$ {
        types { }
        default_type text/plain;
        charset utf-8;
    }

    location ~ \.sh$ {
        types { }
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
